# Selecciones mp-n1 — SOLO LECTURA: recuento, dispersión y líneas (tramo de ajuste) y backtest
# walk-forward frente a la referencia (competición y global), por mercado y grupo de competición,
# IC95 por bootstrap. Lee hl_team_stats (grupo nt). No escribe nada ni pide nada a Highlightly.
# El log solo lleva agregados (nada de equipos ni partidos: datos de Highlightly). Manual, sin cron.
name: sports-nt-backtest

on:
  workflow_dispatch:
    inputs:
      fit_end:
        description: "Fin del tramo de ajuste (AAAA-MM-DD); desde ahí, backtest"
        default: "2023-01-01"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore scipy numpy httpx

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Recuento, dispersión, líneas y backtest (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
          FIT_END: ${{ inputs.fit_end }}
        run: |
          [[ "$FIT_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "fit_end inválido"; exit 1; }
          python scripts/ops/nt_backtest.py
