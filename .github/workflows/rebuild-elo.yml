name: rebuild-elo

# Diagnóstico y reconstrucción del ELO. En CI el cliente oficial de Firestore funciona,
# así que se usa --transport grpc (en local hay que ir por REST: el proxy TLS del puesto
# de trabajo bloquea gRPC).
#
# Cron diario: SOLO siembra historial UEFA (--seed-only) — escribe team_stats y
# api_meta/uefa_seed_progress y nada más. NO recomputa el ELO, NO resetea los pesos y
# NO mueve la frontera de época (model_weights/elo_rebuild.rebuilt_at). Eso último era
# la "cinta de correr": el cron movía rebuilt_at al presente cada noche y dejaba como
# legacy a toda señal de más de un día. El reset de pesos y un recompute completo solo
# ocurren ahora en un workflow_dispatch manual con seed_only=false.
# Reanudable vía api_meta/uefa_seed_progress. rebuild_elo.py corta solo cuando
# X-RateLimit-Requests-Remaining (cabecera real de allsportsapi2) baja de 2, así que
# convive con el collect de cada 6h (sports-collect.yml) sin coordinación explícita —
# en el peor caso esa tanda gasta menos y sigue al día siguiente. 03:00 UTC para no
# solaparse con las horas exactas del collect (0/6/12/18) ni con la petición de
# resultados UEFA (_UEFA_RESULTS_HOURS = {0, 12}).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = solo medir | rebuild = recomputar'
        required: true
        default: 'diagnose'
        type: choice
        options: ['diagnose', 'rebuild']
      confirm:
        description: 'Escribir en Firestore? false = dry-run'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      history_budget:
        description: 'Requests de historial en esta tanda (cuota 100/día)'
        required: false
        default: '80'
      history_pages:
        description: 'Páginas de historial por club (30 partidos cada una)'
        required: false
        default: '1'
      no_uefa:
        description: 'Saltar la siembra UEFA (solo recomputo)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_backup:
        description: 'Saltar backup de team_elo (obligatorio al repetir en el mismo día)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      seed_only:
        description: 'true = solo sembrar historial (sin recompute ni reset de pesos). El cron siempre usa true.'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC diario — SOLO siembra de historial (--seed-only)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: pip install google-cloud-firestore httpx

      - name: Resolver parámetros
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=rebuild" >> "$GITHUB_OUTPUT"
            echo "confirm=true" >> "$GITHUB_OUTPUT"
            echo "seed_only=true" >> "$GITHUB_OUTPUT"
            echo "history_budget=60" >> "$GITHUB_OUTPUT"
            echo "history_pages=1" >> "$GITHUB_OUTPUT"
            echo "no_uefa=false" >> "$GITHUB_OUTPUT"
            echo "skip_backup=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "confirm=${{ inputs.confirm }}" >> "$GITHUB_OUTPUT"
            echo "seed_only=${{ inputs.seed_only }}" >> "$GITHUB_OUTPUT"
            echo "history_budget=${{ inputs.history_budget }}" >> "$GITHUB_OUTPUT"
            echo "history_pages=${{ inputs.history_pages }}" >> "$GITHUB_OUTPUT"
            echo "no_uefa=${{ inputs.no_uefa }}" >> "$GITHUB_OUTPUT"
            echo "skip_backup=${{ inputs.skip_backup }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnóstico de desviación del ELO
        if: ${{ steps.params.outputs.mode == 'diagnose' }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
        run: python scripts/diagnose_elo_drift.py --transport grpc

      - name: Reconstrucción del ELO
        if: ${{ steps.params.outputs.mode == 'rebuild' }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          FOOTBALL_RAPID_API_KEY: ${{ secrets.FOOTBALL_RAPID_API_KEY }}
        run: |
          ARGS="--transport grpc --history-budget ${{ steps.params.outputs.history_budget }}"
          ARGS="$ARGS --history-pages ${{ steps.params.outputs.history_pages }}"
          if [ "${{ steps.params.outputs.confirm }}" = "true" ]; then ARGS="$ARGS --confirm"; fi
          if [ "${{ steps.params.outputs.no_uefa }}" = "true" ]; then ARGS="$ARGS --no-uefa"; fi
          if [ "${{ steps.params.outputs.skip_backup }}" = "true" ]; then ARGS="$ARGS --skip-backup"; fi
          if [ "${{ steps.params.outputs.seed_only }}" = "true" ]; then ARGS="$ARGS --seed-only"; fi
          python scripts/rebuild_elo.py $ARGS

      - name: Verificación posterior
        if: ${{ steps.params.outputs.mode == 'rebuild' && steps.params.outputs.confirm == 'true' && steps.params.outputs.seed_only != 'true' }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
        run: python scripts/diagnose_elo_drift.py --transport grpc
