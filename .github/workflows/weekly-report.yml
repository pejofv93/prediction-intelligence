name: weekly-report
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Mismo grupo que learning-engine: el reporte lee accuracy_log y model_weights, que el
# aprendizaje está escribiendo. /run-learning es síncrono (responde al terminar), así que
# el grupo serializa el trabajo real: el reporte espera a que acabe el aprendizaje.
concurrency:
  group: learning-engine
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Run — weekly report
        run: |
          curl -X POST "${{ secrets.TELEGRAM_BOT_URL }}/send-weekly-report" \
            -H "Content-Type: application/json" \
            -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
            --connect-timeout 60 \
            --max-time 300 \
            --fail --silent --show-error

      - name: Trigger production backtest (actualiza model_weights con datos reales)
        # Corre aunque el reporte falle (Telegram lo rechace → 502); no si se cancela.
        if: success() || failure()
        run: |
          curl -X POST "${{ secrets.SPORTS_AGENT_URL }}/run-production-backtest" \
            -H "Content-Type: application/json" \
            -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 1 \
            --retry-delay 5 \
            --fail --silent --show-error || true
