# Ficha de partido de Tendencias (mp-v1): backtest (etiquetas), fichas y graduación.
# Aislado del feed actual.
# Manual: dry_run=true por defecto (no escribe nada). Escribir exige dry_run=false Y confirmar=ESCRIBIR.
# Cron: 16:00 UTC (la principal: aunque GitHub la retrase horas, llega antes de congelar los
# partidos del día siguiente) y 02:00 UTC (solo refresca). Cada pasada escribe fichas
# (Highlightly solo SP2, como mucho 3 peticiones, sin repetir lo mirado en 20 h) y después gradúa.
# Las dos son idempotentes: no reescriben si no cambia el hash y nunca tocan una ficha congelada.
# Femenino (mp-w1, datos de Highlightly): paso aparte después, que no bloquea la publicación de la
# web si falla (continue-on-error); su resumen solo lleva recuentos (nada de equipos ni partidos).
name: sports-match-previews
# Las pasadas del repartidor se llaman "fichas programadas": trends-web-publish las reconoce así.
run-name: ${{ inputs.programado == 'true' && 'fichas programadas' || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Qué ejecutar"
        type: choice
        options: [previews, backtest, grade, women_backtest, women_previews, women_grade]
        default: previews
      dry_run:
        description: "true = solo calcula y cuenta"
        type: choice
        options: ["true", "false"]
        default: "true"
      highlightly:
        description: "previews: usar Highlightly (reserva manual) para lo que falte"
        type: choice
        options: ["false", "true"]
        default: "false"
      hl_max:
        description: "previews: máximo de peticiones a Highlightly"
        default: "3"
      hl_divs:
        description: "previews: ligas para Highlightly, separadas por comas (vacío = todas)"
        default: "SP2"
      confirmar:
        description: "Para dry_run=false escribe ESCRIBIR"
        default: ""
      programado:
        description: "Solo el repartidor (/dispatch): true = hacer lo mismo que el cron"
        default: "false"

concurrency:
  group: sports-match-previews
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar confirmación
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.programado != 'true' && inputs.dry_run == 'false' && inputs.confirmar != 'ESCRIBIR' }}
        run: |
          echo "dry_run=false exige confirmar=ESCRIBIR — no se llama al servicio"
          exit 1
      - name: Trigger Cloud Run (sync)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.programado != 'true' }}
        env:
          JOB: ${{ inputs.job }}
          DRY_RUN: ${{ inputs.dry_run }}
          HL: ${{ inputs.highlightly }}
          HL_MAX: ${{ inputs.hl_max }}
          HL_DIVS: ${{ inputs.hl_divs }}
        run: |
          [[ "$HL_DIVS" =~ ^[A-Z0-9,]*$ ]] || { echo "hl_divs inválido"; exit 1; }
          case "$JOB" in
            previews) path="run-match-previews?dry_run=$DRY_RUN&highlightly=$HL&hl_max=$HL_MAX&hl_divs=$HL_DIVS" ;;
            backtest) path="run-match-preview-backtest?dry_run=$DRY_RUN" ;;
            grade)    path="run-match-preview-grade?dry_run=$DRY_RUN" ;;
            women_backtest) path="run-women-backtest?dry_run=$DRY_RUN" ;;   # solo agregados en el log
            women_previews) path="run-women-previews?dry_run=$DRY_RUN&highlightly=$HL" ;;
            women_grade)    path="run-women-grade?dry_run=$DRY_RUN" ;;
          esac
          curl -X POST "${{ secrets.SPORTS_AGENT_URL }}/$path" \
            -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
            --max-time 1100 \
            --no-buffer \
            --fail --silent --show-error > out.txt
          grep -v '^summary: ' out.txt
          grep '^summary: ' out.txt | sed 's/^summary: //' | python3 -m json.tool --no-ensure-ascii
          grep -q '^done ' out.txt
          grep -q '^summary: {"ok": true' out.txt

      - name: Programado — fichas y graduación (escriben)
        if: ${{ github.event_name == 'schedule' || inputs.programado == 'true' }}
        run: |
          set -uo pipefail
          # Cada paso corre aunque falle el anterior (la graduación no depende de las fichas nuevas);
          # el paso sale en rojo al final si alguno falló.
          fallos=""
          for path in "run-match-previews?dry_run=false&highlightly=true&hl_max=3&hl_divs=SP2" \
                      "run-match-preview-grade?dry_run=false"; do
            echo "== $path"
            curl -X POST "${{ secrets.SPORTS_AGENT_URL }}/$path" \
              -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
              --max-time 1100 \
              --no-buffer \
              --fail --silent --show-error > out.txt || fallos="$fallos ${path%%\?*}(curl)"
            grep -v '^summary: ' out.txt
            grep '^summary: ' out.txt | sed 's/^summary: //' | python3 -m json.tool --no-ensure-ascii
            { grep -q '^done ' out.txt && grep -q '^summary: {"ok": true' out.txt; } || fallos="$fallos ${path%%\?*}"
          done
          [ -z "$fallos" ] || { echo "fallaron:$fallos"; exit 1; }

      - name: Programado — femenino, fichas y graduación (escriben; no bloquea)
        # También si falló el paso masculino: son independientes.
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.programado == 'true') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          for path in "run-women-previews?dry_run=false&highlightly=true" \
                      "run-women-grade?dry_run=false"; do
            echo "== $path"
            curl -X POST "${{ secrets.SPORTS_AGENT_URL }}/$path" \
              -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
              --max-time 1100 \
              --no-buffer \
              --fail --silent --show-error > out.txt
            grep -v '^summary: ' out.txt
            grep '^summary: ' out.txt | sed 's/^summary: //' | python3 -m json.tool --no-ensure-ascii
            grep -q '^done ' out.txt
            grep -q '^summary: {"ok": true' out.txt
          done
