name: sports-funnel

# Diagnóstico READ-ONLY del embudo de señales de fútbol.
# Manual: se lanza a mano cuando hace falta ver por qué (no) se emiten señales.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Ventana de partidos en dias'
        required: false
        default: '7'
      log_minutes:
        description: 'Minutos de logs de Cloud Run a revisar (0 = omitir)'
        required: false
        default: '30'

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Embudo desde Firestore
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
        run: python scripts/sports_funnel.py --days ${{ inputs.days }}

      - name: Traza del ultimo analyze (Cloud Run)
        if: ${{ inputs.log_minutes != '0' }}
        continue-on-error: true
        run: |
          SINCE=$(date -u -d "${{ inputs.log_minutes }} minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "logs desde $SINCE"
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"sports-agent\" AND timestamp>=\"$SINCE\" AND (textPayload:\"generate_signal\" OR textPayload:\"ventana 72h\" OR textPayload:\"sin partidos en 48h\")" \
            --project prediction-intelligence --limit 300 --order asc \
            --format='value(textPayload)' \
            | grep -v "skipping generate_signal" \
            | sed 's/^[0-9-]* [0-9:,]* analyzers.value_bet_engine [A-Z]* //' \
            | head -120
