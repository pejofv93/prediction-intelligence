# Repartidor en modo de prueba frente al cron de GitHub (scripts/ops/dispatch_dry_report.py).
# SOLO LECTURA: dispatch_claims_dry (Firestore) y la lista de ejecuciones de Actions.
# Solo tareas y horas UTC. Manual, sin cron.
name: dispatch-dry-report

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Ventana en horas"
        default: "24"

permissions:
  contents: read
  actions: read

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore

      - name: Ejecuciones programadas de GitHub (event=schedule)
        env:
          GH_TOKEN: ${{ github.token }}
          HOURS: ${{ inputs.hours }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, ".")
          from datetime import datetime, timedelta, timezone
          from shared.dispatch_schedule import TASKS
          since = (datetime.now(timezone.utc) - timedelta(hours=int(os.environ["HOURS"]) + 1)).strftime("%Y-%m-%dT%H:%M:%SZ")
          out = {}
          for wf in sorted({t.workflow for t in TASKS.values()}):
              r = subprocess.run(["gh", "run", "list", "--workflow", wf, "--event", "schedule", "--limit", "200",
                                  "--created", f">={since}", "--json", "createdAt"], capture_output=True, text=True)
              out[wf] = [x["createdAt"] for x in json.loads(r.stdout or "[]")]
          json.dump(out, open("gh_runs.json", "w"))
          print("workflows consultados:", len(out))
          PY

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Informe (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
          HOURS: ${{ inputs.hours }}
          GH_RUNS: gh_runs.json
        run: python scripts/ops/dispatch_dry_report.py
