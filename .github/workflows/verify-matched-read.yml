name: verify-matched-read
# Verificación puntual: lee prod matched_signals de Firestore y las imprime.
# Se borra tras verificar.
on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-cloud-firestore
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Read matched_signals
        env:
          PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import firestore
          db = firestore.Client(project="prediction-intelligence")
          prefix = os.environ.get("PREFIX", "") or "prod"
          coll = f"{prefix}matched_signals"
          docs = [d.to_dict() for d in db.collection(coll).stream()]
          print(f"Colección {coll}: {len(docs)} documentos")
          sure = [d for d in docs if d.get("signal_type") == "surebet"]
          cov = [d for d in docs if d.get("signal_type") == "coverage"]
          print(f"  surebets={len(sure)} coverage={len(cov)}")
          docs.sort(key=lambda s: (0 if s.get("signal_type")=="surebet" else 1,
                                   -float(s.get("qualifying_rating", 0) or 0)))
          for d in docs[:25]:
              print(f"  [{d.get('signal_type'):8s}] {d.get('home_team')} v {d.get('away_team')} | "
                    f"{d.get('selection')}: back {d.get('back_bookmaker')}@{d.get('back_odds')} "
                    f"lay {d.get('lay_odds')} | rating={d.get('qualifying_rating')}% "
                    f"profit/100={d.get('profit_per_100')} | expires={d.get('expires_at','')[:16]}")
          EOF
