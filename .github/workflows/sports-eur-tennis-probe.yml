# Fase 0 de baloncesto (Euroliga) y tenis en Tendencias (scripts/ops/eur_tennis_probe.py).
# SOLO LECTURA: feed y boxscore de Euroliga, alldata.php + 2 xlsx de tennis-data.co.uk y
# upcoming_matches de tenis en Firestore. No escribe nada. ~13 peticiones, 0 de Highlightly.
# Log público: solo recuentos y porcentajes. Manual, sin cron.
name: sports-eur-tennis-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore httpx

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Sonda Euroliga + tenis (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/eur_tennis_probe.py
