# Tenis en Tendencias (Fase 1): carga del historial ATP/WTA (juegos por set) desde
# tennis-data.co.uk (enlaces leídos de alldata.php) → tennis_tournaments.
# SOLO manual. dry_run=true por defecto (descarga y cuenta, no escribe). Escribir exige
# dry_run=false Y confirmar=ESCRIBIR. El log solo lleva agregados.
name: sports-tennis-load
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Años (2024,2025,2026); vacío = los 3 últimos"
        default: ""
      dry_run:
        description: "true = solo descarga y cuenta"
        type: choice
        options: ["true", "false"]
        default: "true"
      confirmar:
        description: "Para dry_run=false escribe ESCRIBIR"
        default: ""

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar confirmación
        if: ${{ inputs.dry_run == 'false' && inputs.confirmar != 'ESCRIBIR' }}
        run: |
          echo "dry_run=false exige confirmar=ESCRIBIR — no se llama al servicio"
          exit 1
      - name: Trigger Cloud Run (sync)
        env:
          YEARS: ${{ inputs.years }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          curl -X POST "${{ secrets.SPORTS_AGENT_URL }}/run-tennis-data" -G \
            --data-urlencode "years=${YEARS}" \
            --data-urlencode "dry_run=${DRY_RUN}" \
            -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
            --max-time 800 \
            --no-buffer \
            --fail --silent --show-error | tee out.txt
          grep -q '^done ' out.txt
          grep -q '^summary: {"ok": true' out.txt
