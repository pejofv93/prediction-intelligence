# Backtest de copas con el modelo de clubes (scripts/ops/cups_backtest.py).
# SOLO LECTURA: hl_team_stats (cups) y hl_matches de Firestore + CSV públicos de football-data.co.uk.
# No escribe nada ni pide nada a Highlightly. Log: solo agregados. Manual, sin cron.
name: cups-backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore httpx scipy

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Backtest de copas (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/cups_backtest.py
