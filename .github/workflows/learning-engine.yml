name: learning-engine
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Cloud Run (sync)
        run: |
          curl -X POST "${{ secrets.SPORTS_AGENT_URL }}/run-learning" \
            -H "Content-Type: application/json" \
            -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
            --max-time 900 \
            --no-buffer \
            --fail --silent --show-error
