name: learning-engine
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Una sola ejecución a la vez: dos solapadas leían model_weights al empezar y la segunda
# pisaba lo que sumó la primera. La que llega espera; no se cancela la que está corriendo.
concurrency:
  group: learning-engine
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Cloud Run (sync)
        run: |
          curl -X POST "${{ secrets.SPORTS_AGENT_URL }}/run-learning" \
            -H "Content-Type: application/json" \
            -H "x-cloud-token: ${{ secrets.CLOUD_RUN_TOKEN }}" \
            --max-time 900 \
            --no-buffer \
            --fail --silent --show-error
