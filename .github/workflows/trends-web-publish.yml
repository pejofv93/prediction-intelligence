# Publica la web de Tendencias en Cloudflare Pages. Sin cron propio:
#   - a mano (confirmar=PUBLICAR), o
#   - sola al terminar EN VERDE una pasada PROGRAMADA de sports-match-previews (workflow_run),
#     para que la vista "Partidos" lleve las fichas recién escritas. Las pasadas manuales de
#     sports-match-previews (dry-run, backtest…) no publican; una fallida tampoco.
#
# La web es PÚBLICA (sin usuario ni contraseña) pero no indexable: el middleware
# (functions/_middleware.js) añade a todo noindex/nofollow, no-store, no-referrer y nosniff.
#
# ⚠️ Cuando la web incluya datos de jugadores de Highlightly, debe volver a ser PRIVADA:
#    PRIVATE = true en el middleware, secretos TRENDS_WEB_USER/TRENDS_WEB_PASS y las
#    comprobaciones 401/401/200 con prueba de datos falsos y retirada del despliegue fallido
#    (versión privada de este flujo: commit 30fb955).
#
# Sin credenciales de GCP: los porcentajes se calculan desde los CSV de football-data.co.uk y
# las fichas de partido (vista "Partidos") se descargan de sports-agent GET /match-previews/web
# (solo lectura, con CLOUD_RUN_TOKEN). Los JSON se generan en el runner y van directo a
# Cloudflare: no se suben a git ni como artefacto y el log solo muestra recuentos.
#
# Orden, parando al primer fallo:
#   1. Faltan secretos → para sin tocar Cloudflare.
#   2. Tests del middleware y de la exportación.
#   3. Crea el proyecto de Pages si no existe.
#   4. Genera los datos reales, los publica y comprueba, en la URL del despliegue y en la del
#      proyecto, que /, /data/rates.json, /data/previews.json y /app.js dan 200 sin credenciales
#      y llevan noindex.
#
# Secretos de GitHub: CLOUDFLARE_API_TOKEN (solo "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID,
# SPORTS_AGENT_URL y CLOUD_RUN_TOKEN (los mismos de los demás flujos de sports-agent).
name: trends-web-publish

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe PUBLICAR"
        default: ""
  workflow_run:
    workflows: [sports-match-previews]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trends-web-publish
  cancel-in-progress: false

env:
  PROJECT: tendencias-pi
  WRANGLER: npx --yes wrangler@4.151.3
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SPORTS_AGENT_URL: ${{ secrets.SPORTS_AGENT_URL }}
  CLOUD_RUN_TOKEN: ${{ secrets.CLOUD_RUN_TOKEN }}

jobs:
  publicar:
    # Lanzado por sports-match-previews: solo si fue una pasada programada y terminó en verde.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar confirmación y secretos
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A mano exige PUBLICAR; tras sports-match-previews la condición del trabajo ya filtró.
          [ "$EVENTO" = "workflow_run" ] || [ "$CONFIRMAR" = "PUBLICAR" ] || { echo "Escribe confirmar=PUBLICAR"; exit 1; }
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SPORTS_AGENT_URL CLOUD_RUN_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "Faltan secretos:$missing — no se toca Cloudflare"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests del middleware y de la exportación
        run: |
          set -euo pipefail
          node --test trends_web/tests/middleware.test.mjs
          pip install --quiet httpx pytest
          python -m pytest -q trends_web/tests

      - name: Proyecto de Pages
        working-directory: trends_web
        run: |
          set -euo pipefail
          if ! $WRANGLER pages project list 2>/dev/null | grep -q "\b$PROJECT\b"; then
            $WRANGLER pages project create "$PROJECT" --production-branch main
          fi

      - name: Comprobador de la web pública
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          # check.sh URL_BASE → 0 si /, los dos JSON y /app.js dan 200 sin credenciales y llevan noindex
          set -uo pipefail
          base="$1"; bad=0
          # Un despliegue nuevo tarda en existir en DNS/TLS (curl da 000): se espera hasta 5 min.
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base/")" != "000" ] && break
            sleep 10
          done
          for path in / /data/rates.json /data/previews.json /app.js; do
            for i in 1 2 3 4 5 6; do   # la publicación tarda unos segundos en propagarse
              hdr=$(curl -s -o /dev/null -D - --max-time 10 "$base$path" | tr -d '\r')
              code=$(awk 'NR==1{print $2}' <<<"$hdr")
              [ "$code" = "200" ] && break
              sleep 10
            done
            robots=$(grep -i '^x-robots-tag:' <<<"$hdr" | cut -d' ' -f2- )
            cache=$(grep -i '^cache-control:' <<<"$hdr" | cut -d' ' -f2- )
            echo "  $path → sin credenciales ${code:-000} · X-Robots-Tag: ${robots:-falta} · Cache-Control: ${cache:-falta}"
            [ "$code" = "200" ] && [[ "$robots" == *noindex* ]] || bad=1
          done
          exit $bad
          EOF
          chmod +x "$RUNNER_TEMP/check.sh"

      - name: Generar datos reales (desde los CSV)
        run: python trends_web/export_rates.py --out trends_web/site/data/rates.json

      - name: Descargar fichas de partido (sports-agent, solo lectura)
        run: |
          set -euo pipefail
          out=trends_web/site/data/previews.json
          # sports-agent arranca en frío (min-instances=0): reintenta antes de rendirse.
          curl -sS --fail --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
            -H "x-cloud-token: $CLOUD_RUN_TOKEN" \
            "$SPORTS_AGENT_URL/match-previews/web?days=7" -o "$out"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(f\"Fichas: {len(d['matches'])} partidos ({d['model_version']}, {d['days']} días)\")" "$out"

      - name: Publicar y comprobar
        working-directory: trends_web
        run: |
          set -uo pipefail
          out=$($WRANGLER pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1)
          dep=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' <<<"$out" | head -1)
          [ -n "$dep" ] || { echo "ERROR: no se encontró la URL del despliegue"; exit 1; }
          prod="https://${dep#https://*.}"
          ok=1
          echo "Despliegue:"; "$RUNNER_TEMP/check.sh" "$dep" || ok=0
          echo "URL del proyecto:"; "$RUNNER_TEMP/check.sh" "$prod" || ok=0
          rm -f site/data/rates.json site/data/previews.json
          [ "$ok" = 1 ] || { echo "ERROR: la web no responde 200 sin credenciales o le falta noindex"; exit 1; }
          echo "Publicada en $prod (pública, noindex)."
