# Publica la web de Tendencias en Cloudflare Pages. Sin cron propio:
#   - a mano (confirmar=PUBLICAR), o
#   - sola al terminar EN VERDE una pasada PROGRAMADA de sports-match-previews (workflow_run),
#     para que la vista "Partidos" lleve las fichas recién escritas. Las pasadas manuales de
#     sports-match-previews (dry-run, backtest…) no publican; una fallida tampoco.
#
# La web es PRIVADA (desde 12-nov-2026, antes de publicar datos de Highlightly): usuario y
# contraseña (autenticación básica en functions/_middleware.js, PRIVATE = true) y, además,
# noindex/nofollow, no-store, no-referrer y nosniff en todo.
#
# Sin credenciales de GCP: los porcentajes se calculan desde los CSV de football-data.co.uk y
# las fichas de partido (vista "Partidos") se descargan de sports-agent GET /match-previews/web
# (solo lectura, con CLOUD_RUN_TOKEN). Los JSON se generan en el runner y van directo a
# Cloudflare: no se suben a git ni como artefacto (el repositorio es público) y el log solo
# muestra recuentos.
#
# Orden, parando al primer fallo:
#   1. Faltan secretos (o la contraseña es corta o lleva espacios) → para sin tocar Cloudflare.
#   2. Tests de la protección y de la exportación.
#   3. Crea el proyecto de Pages si no existe y guarda en él usuario y contraseña (secretos
#      cifrados de Cloudflare, leídos de los secretos de GitHub por stdin, nunca en el log).
#   4. PRUEBA con datos falsos: publica una página y unos JSON de mentira y exige 401 sin
#      credenciales y con credenciales erróneas, y 200 con las buenas (y noindex), en la URL del
#      despliegue y en la del proyecto. Si algo no cuadra, para: los datos reales no han salido.
#   5. Genera los datos reales, los publica y repite las comprobaciones. Si fallaran, vuelve a
#      publicar la prueba (retira los datos), borra el despliegue fallido y sale en rojo.
#
# Secretos de GitHub: CLOUDFLARE_API_TOKEN (solo "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID,
# SPORTS_AGENT_URL y CLOUD_RUN_TOKEN (los de los demás flujos de sports-agent), TRENDS_WEB_USER
# y TRENDS_WEB_PASS (contraseña nueva, distinta de la del dashboard).
name: trends-web-publish

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe PUBLICAR"
        default: ""
  workflow_run:
    workflows: [sports-match-previews]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trends-web-publish
  cancel-in-progress: false

env:
  PROJECT: tendencias-pi
  WRANGLER: npx --yes wrangler@4.151.3
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SPORTS_AGENT_URL: ${{ secrets.SPORTS_AGENT_URL }}
  CLOUD_RUN_TOKEN: ${{ secrets.CLOUD_RUN_TOKEN }}
  WEB_USER: ${{ secrets.TRENDS_WEB_USER }}
  WEB_PASS: ${{ secrets.TRENDS_WEB_PASS }}

jobs:
  publicar:
    # Lanzado por sports-match-previews: solo si fue una pasada programada y terminó en verde.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Comprobar confirmación y secretos
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A mano exige PUBLICAR; tras sports-match-previews la condición del trabajo ya filtró.
          [ "$EVENTO" = "workflow_run" ] || [ "$CONFIRMAR" = "PUBLICAR" ] || { echo "Escribe confirmar=PUBLICAR"; exit 1; }
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SPORTS_AGENT_URL CLOUD_RUN_TOKEN WEB_USER WEB_PASS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "Faltan secretos:$missing — no se toca Cloudflare"; exit 1; }
          [ "${#WEB_PASS}" -ge 16 ] || { echo "La contraseña debe tener al menos 16 caracteres"; exit 1; }
          # Un salto de línea o espacio colado al guardar el secreto impediría entrar desde el navegador.
          for v in WEB_USER WEB_PASS; do
            [[ "${!v}" =~ [[:space:]] ]] && { echo "$v contiene espacios o saltos de línea: vuelve a guardarlo"; exit 1; }
          done
          true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests de la protección y de la exportación
        run: |
          set -euo pipefail
          node --test trends_web/tests/middleware.test.mjs
          pip install --quiet httpx pytest
          python -m pytest -q trends_web/tests

      - name: Proyecto de Pages y acceso (usuario y contraseña)
        working-directory: trends_web
        run: |
          set -euo pipefail
          if ! $WRANGLER pages project list 2>/dev/null | grep -q "\b$PROJECT\b"; then
            $WRANGLER pages project create "$PROJECT" --production-branch main
          fi
          printf '%s' "$WEB_USER" | $WRANGLER pages secret put TRENDS_WEB_USER --project-name "$PROJECT" >/dev/null
          printf '%s' "$WEB_PASS" | $WRANGLER pages secret put TRENDS_WEB_PASS --project-name "$PROJECT" >/dev/null
          echo "Acceso configurado en el proyecto $PROJECT."

      - name: Comprobador de acceso
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          # check.sh URL_BASE → 0 si cada ruta da 401 sin credenciales y con erróneas, y 200 con
          # las buenas, siempre con noindex
          set -uo pipefail
          base="$1"; bad=0
          # Un despliegue nuevo tarda en existir en DNS/TLS (curl da 000): se espera hasta 5 min.
          # Mientras, no se sirve nada.
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base/")" != "000" ] && break
            sleep 10
          done
          # Recién publicado, Cloudflare puede dar 404 o respuestas incoherentes unos segundos
          # (13-nov: portada 404 con las credenciales buenas, 404 con las erróneas). Se repite
          # hasta 90 s por URL. Pero un 2xx sin credenciales o con las erróneas es una fuga:
          # falla AL MOMENTO, sin reintentar.
          deadline=$((SECONDS + 90))
          for path in / /data/rates.json /data/previews.json /app.js; do
            while :; do
              anon=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base$path")
              if [[ "$anon" == 2* ]]; then
                echo "  $path → sin credenciales $anon: FUGA, se para sin reintentar"; exit 1
              fi
              wrong=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -u "nadie:incorrecta" "$base$path")
              if [[ "$wrong" == 2* ]]; then
                echo "  $path → credenciales erróneas $wrong: FUGA, se para sin reintentar"; exit 1
              fi
              hdr=$(curl -s -o /dev/null -D - --max-time 10 -u "$WEB_USER:$WEB_PASS" "$base$path" | tr -d '\r')
              good=$(awk 'NR==1{print $2}' <<<"$hdr")
              robots=$(grep -i '^x-robots-tag:' <<<"$hdr" | cut -d' ' -f2- )
              ok=0
              [ "$anon" = "401" ] && [ "$wrong" = "401" ] && [ "$good" = "200" ] && [[ "$robots" == *noindex* ]] && ok=1
              [ "$ok" = 1 ] || [ "$SECONDS" -ge "$deadline" ] && break
              sleep 5
            done
            echo "  $path → sin credenciales $anon · erróneas $wrong · buenas ${good:-000} · X-Robots-Tag: ${robots:-falta}"
            [ "$ok" = 1 ] || bad=1
          done
          exit $bad
          EOF
          chmod +x "$RUNNER_TEMP/check.sh"

      - name: Prueba con datos falsos
        working-directory: trends_web
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/prueba"; mkdir -p "$P/data"
          printf '<!doctype html><title>Prueba</title><p>Prueba de acceso.</p>' > "$P/index.html"
          printf 'console.log("prueba");' > "$P/app.js"
          printf '{"prueba": true}' > "$P/data/rates.json"
          printf '{"prueba": true}' > "$P/data/previews.json"
          cp -r functions "$P/functions"   # la prueba lleva la misma protección que la web real
          out=$(cd "$P" && $WRANGLER pages deploy . --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1)
          dep=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' <<<"$out" | head -1)
          [ -n "$dep" ] || { echo "No se encontró la URL del despliegue"; exit 1; }
          prod="https://${dep#https://*.}"
          echo "PROD=$prod" >> "$GITHUB_ENV"
          echo "Prueba en el despliegue:"; "$RUNNER_TEMP/check.sh" "$dep"
          echo "Prueba en la URL del proyecto:"; "$RUNNER_TEMP/check.sh" "$prod"

      - name: Generar datos reales (desde los CSV)
        run: python trends_web/export_rates.py --out trends_web/site/data/rates.json

      - name: Descargar fichas de partido (sports-agent, solo lectura)
        run: |
          set -euo pipefail
          out=trends_web/site/data/previews.json
          # sports-agent arranca en frío (min-instances=0): reintenta antes de rendirse.
          curl -sS --fail --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
            -H "x-cloud-token: $CLOUD_RUN_TOKEN" \
            "$SPORTS_AGENT_URL/match-previews/web?days=7" -o "$out"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(f\"Fichas: {len(d['matches'])} partidos ({d['model_version']}, {d['days']} días)\")" "$out"

      - name: Publicar y comprobar
        working-directory: trends_web
        run: |
          set -uo pipefail
          out=$($WRANGLER pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1)
          dep=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' <<<"$out" | head -1)
          ok=1
          [ -n "$dep" ] || ok=0
          if [ "$ok" = 1 ]; then
            echo "Despliegue:"; "$RUNNER_TEMP/check.sh" "$dep" || ok=0
            echo "URL del proyecto:"; "$RUNNER_TEMP/check.sh" "$PROD" || ok=0
          fi
          rm -f site/data/rates.json site/data/previews.json
          if [ "$ok" != 1 ]; then
            echo "ERROR: la protección no responde como debe: se retiran los datos"
            # 1) La prueba vuelve a ser la publicación activa (Cloudflare no deja borrar la activa).
            (cd "$RUNNER_TEMP/prueba" && $WRANGLER pages deploy . --project-name "$PROJECT" --branch main --commit-dirty=true >/dev/null 2>&1) \
              || echo "ERROR: no se pudo republicar la prueba"
            # 2) Cada despliegue conserva su propia URL: se borra el fallido, buscado por su URL.
            if [ -z "$dep" ]; then
              echo "ERROR: sin URL del despliegue fallido; revisa a mano con: wrangler pages deployment list --project-name $PROJECT"
              exit 1
            fi
            id=$($WRANGLER pages deployment list --project-name "$PROJECT" --environment production --json 2>/dev/null \
                 | python3 "$GITHUB_WORKSPACE/trends_web/deployment_id.py" "$dep")
            if [ -z "$id" ]; then
              echo "ERROR: no se encontró el id de $dep; BÓRRALO A MANO (wrangler pages deployment delete)"
              exit 1
            fi
            $WRANGLER pages deployment delete "$id" --project-name "$PROJECT" --force >/dev/null 2>&1 \
              || { echo "ERROR: no se pudo borrar el despliegue $id; BÓRRALO A MANO"; exit 1; }
            # 3) Su URL ya no puede servir los datos, ni con las credenciales buenas.
            gone=0
            for i in 1 2 3 4 5 6 7 8 9; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -u "$WEB_USER:$WEB_PASS" "$dep/data/rates.json")
              if [ "$code" != "200" ]; then gone=1; break; fi
              sleep 10
            done
            if [ "$gone" = 1 ]; then
              echo "Despliegue fallido $id borrado: su URL ya no sirve los datos (HTTP $code)."
            else
              echo "ERROR: $dep sigue sirviendo los datos 90 s después de borrarlo (id $id); BÓRRALO A MANO"
            fi
            exit 1
          fi
          echo "Publicada en $PROD (privada, noindex)."
