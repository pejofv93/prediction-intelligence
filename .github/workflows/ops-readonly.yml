# Dos consultas de SOLO LECTURA (manual, sin cron). No escribe nada.
#  - fichas: aciertos de las fichas graduadas por liga y mercado (scripts/ops/previews_grade_summary.py).
#  - logging: qué cuota de Cloud Logging agota job_runner desde Actions (scripts/ops/logging_quota_check.py).
#  - avisos: avisos de la última pasada de analyze en Actions por tipo (scripts/ops/warning_types.py).
#  - collect: tiempo de cada paso de sports-collect desde los logs de Cloud Run de sports-agent
#    (scripts/ops/collect_step_times.py). El log solo lleva pasos, minutos y recuentos.
name: ops-readonly

on:
  workflow_dispatch:
    inputs:
      since:
        description: "fichas: graduadas desde (AAAA-MM-DD)"
        default: "2026-11-15"
      days:
        description: "collect: días de logs"
        default: "16"

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Fichas graduadas por liga y mercado
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
          SINCE: ${{ inputs.since }}
        run: python scripts/ops/previews_grade_summary.py

      - name: Tiempo por paso de sports-collect (logs de Cloud Run)
        env:
          PYTHONIOENCODING: utf-8
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND textPayload:"collect"' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 20000 --format json > logs.json \
            2> err.txt || { echo "no se pudieron leer los logs:"; grep -oE "PERMISSION_DENIED|permission[^.]*" err.txt | head -2; exit 1; }
          echo "entradas leídas: $(python3 -c 'import json;print(len(json.load(open("logs.json"))))')"
          LOGS_FILE=logs.json python scripts/ops/collect_step_times.py
          rm -f logs.json err.txt

      - name: Recuentos de cada pasada de sports-analyze (Cloud Run y GitHub Actions)
        env:
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND textPayload:"analyze: "' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 5000 \
            --format 'value(timestamp,resource.labels.revision_name,textPayload)' > logs.txt 2> err.txt \
            || { grep -oE "PERMISSION_DENIED|permission[^.]*" err.txt | head -2; exit 1; }
          # Solo líneas de formato fijo con recuentos; origen = Actions o Cloud Run (sin nombre de revisión).
          grep -E "analyze: ([0-9]+ enriched \(7d\) de [0-9]+ upcoming|[0-9]+ senales generadas de [0-9]+ enriquecidos|tenis — [0-9]+ señales|[0-9]+ partidos de (tenis|baloncesto) \(48h\))" logs.txt \
            | awk -F'\t' '{o = ($2 == "github-actions") ? "actions  " : "cloud-run"; match($3, /analyze: .*/); print substr($1,1,16), o, substr($3, RSTART)}' \
            | sed -E 's/ en [0-9.]+s / /' | sort | tail -80 || echo "sin líneas"
          rm -f logs.txt err.txt

      - name: Cloud Logging desde GitHub Actions — qué cuota se agota (Monitoring y Service Usage)
        env:
          DAYS: ${{ inputs.days }}
          PYTHONIOENCODING: utf-8
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          echo "== Líneas escritas por job_runner (revisión github-actions) por hora UTC"
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND resource.labels.revision_name="github-actions"' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 20000 \
            --format 'value(timestamp)' 2> err.txt | cut -c1-13 | sort | uniq -c || true
          grep -oE "PERMISSION_DENIED" err.txt | head -1; rm -f err.txt
          TOKEN=$(gcloud auth print-access-token) PROJECT=prediction-intelligence \
            python scripts/ops/logging_quota_check.py

      - name: Avisos de la última pasada de sports-analyze en Actions, por tipo (sin nombres ni cifras)
        env:
          DAYS: ${{ inputs.days }}
          PYTHONIOENCODING: utf-8
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND resource.labels.revision_name="github-actions" AND severity=WARNING AND (textPayload:"analyzers.value_bet_engine WARNING" OR textPayload:"analyzers.player_props WARNING")' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 5000 \
            --format 'json(timestamp,textPayload)' > warn.json 2> err.txt \
            || { grep -oE "PERMISSION_DENIED" err.txt | head -1; exit 1; }
          # Al log solo va la plantilla del código (texto del repo) con {…} y cuántas veces salió.
          LOGS_FILE=warn.json python scripts/ops/warning_types.py \
            analyzers.value_bet_engine=services/sports-agent/analyzers/value_bet_engine.py \
            analyzers.player_props=services/sports-agent/analyzers/player_props.py
          rm -f warn.json err.txt

      - name: Permiso de logs — ¿puede esta cuenta (la de GCP_SA_KEY) escribir en Cloud Logging?
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          # testIamPermissions: la cuenta pregunta por SUS permisos; no necesita leer la política IAM.
          # Solo se imprime qué permisos tiene, en el proyecto de los logs y en el del secreto.
          TOKEN=$(gcloud auth print-access-token)
          for P in prediction-intelligence "$GOOGLE_CLOUD_PROJECT"; do
            R=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d '{"permissions":["logging.logEntries.create","logging.logEntries.list"]}' \
              "https://cloudresourcemanager.googleapis.com/v1/projects/$P:testIamPermissions")
            echo "proyecto $([ "$P" = prediction-intelligence ] && echo 'de los logs' || echo 'del secreto'): $(echo "$R" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("permissions") or d.get("error",{}).get("status") or "ninguno")')"
          done
          echo "misma cuenta que sports-analyze: $(python3 -c 'import json,os; print(json.load(open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]))["client_email"].split("@")[0])')"

      - name: Props de jugadores — understat y goleadores de football-data por día y origen (Cloud Run / Actions)
        env:
          DAYS: ${{ inputs.days }}
          PYTHONIOENCODING: utf-8
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND (textPayload:"understat" OR textPayload:"fdorg_scorers")' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 20000 \
            --format 'json(timestamp,textPayload,resource.labels.revision_name)' > props.json 2> err.txt \
            || { grep -oE "PERMISSION_DENIED" err.txt | head -1; exit 1; }
          LOGS_FILE=props.json python scripts/ops/props_sources_log.py
          rm -f props.json err.txt
          # Sonda desde este runner (IP de GitHub): solo el código HTTP de una petición a cada fuente.
          echo "understat POST getPlayersStats: $(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'X-Requested-With: XMLHttpRequest' -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            --data 'league=EPL&season=2025' https://understat.com/main/getPlayersStats/)"
          echo "understat portada: $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://understat.com/)"
          echo "football-data scorers PL: $(curl -s -o /dev/null -w '%{http_code}' \
            -H "X-Auth-Token: $FOOTBALL_API_KEY" 'https://api.football-data.org/v4/competitions/PL/scorers?limit=20')"
