# ¿Cuánto se parece la réplica de Sports v1 (scripts/ops/v1_replica.py) al modelo real?
# SOLO LECTURA: lee predictions (fútbol 1X2 desde el 22-oct) y los CSV públicos de
# football-data.co.uk. No escribe nada. Imprime solo agregados (nada de equipos ni partidos).
# Manual, sin cron.
name: sports-replica-fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fidelidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore scipy numpy httpx

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Réplica frente a v1 (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/replica_fidelity.py
