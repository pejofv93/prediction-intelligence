# Desglose de la tabla "Calibración histórica de confianza" del informe diario. SOLO LECTURA:
# lee predictions y alerts_sent, no escribe nada. Manual, sin cron.
name: sports-calib-breakdown

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desglose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Desglose (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
        run: python scripts/ops/calib_breakdown.py
