# SOLO LECTURA (21-nov-2026): por qué no se mueven cifras de los informes de Telegram.
#   1) informe diario: predictions (ventana de 500) frente a shadow_trades de Sports;
#   2) «📈 Señales de tendencia»: trend_signals, trend_accuracy_log, trend_runs,
#      trend_daily_reports, match_results; y las líneas de resumen de trend_grader y
#      trend_finder en los logs de Cloud Run (solo recuentos).
# Log público: solo recuentos y fechas. Manual, sin cron.
name: reports-readonly-check

on:
  workflow_dispatch:
    inputs:
      days:
        description: "días de logs de Cloud Run"
        default: "4"

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Firestore (recuentos)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/reports_check.py

      - name: Resúmenes de trend_grader y trend_finder (logs de Cloud Run)
        env:
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND (textPayload:"trend_grader" OR textPayload:"trend_finder: " OR textPayload:"trend_daily")' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 2000 \
            --format 'value(timestamp,textPayload)' > logs.txt 2> err.txt \
            || { grep -oE "PERMISSION_DENIED|permission[^.]*" err.txt | head -2; exit 1; }
          # Solo las líneas que llevan únicamente recuentos (formatos fijos del código).
          grep -E "trend_grader(\(series\+model\)|\(rolling\))?: [0-9]+ graduadas|trend_grader: series\+model=|trend_finder: [0-9]+ enriched|trend_finder: un envío por partido|trend_daily: (diario|resumen)" logs.txt \
            | sed -E 's/^([0-9T:-]{16})[^\t]*\t.*(trend_[a-z_]+[:(])/\1 \2/' | sort | tail -60 || echo "sin líneas"
          rm -f logs.txt err.txt

      - name: Resultados de fútbol (logs de Cloud Run, solo recuentos y códigos HTTP)
        env:
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND (textPayload:"get_finished_matches" OR textPayload:"RESULTS_UPDATE" OR textPayload:"football-data.org" OR textPayload:"collect.standings")' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 2000 \
            --format 'value(timestamp,textPayload)' > logs.txt 2> err.txt \
            || { grep -oE "PERMISSION_DENIED|permission[^.]*" err.txt | head -2; exit 1; }
          # Solo recuentos; de los errores de football-data, la ruta sin parámetros y el código HTTP
          # (en /competitions se deja el id de la competición; en /matches nada más).
          grep -oE "^[0-9T:-]{16}|get_finished_matches: [0-9]+ partidos terminados|RESULTS_UPDATE: [0-9]+ partidos [a-zA-Z ]+|Rate limit football-data.org|Timeout en football-data.org /[a-z]+|football-data.org /[a-z]+[^ ]* → HTTP [0-9]{3}|collect.standings: (sin datos para|error en) [A-Z0-9]+( \(id=[0-9]+\))?" logs.txt \
            | sed -E 's#(/competitions/[0-9A-Z]+/[a-z]+)[^ ]*#\1#; s#(/matches)[?/][^ ]*#\1#' \
            | awk '/^[0-9]{4}-/ {ts=$0; next} {print ts " " $0}' | sort | tail -60
          [ -s logs.txt ] || echo "sin líneas"
          rm -f logs.txt err.txt

      - name: Baloncesto — graduación por su vía propia (Firestore, solo recuentos)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/basket_grading_check.py

      - name: Baloncesto — líneas del aprendizaje nocturno (logs de Cloud Run, solo recuentos)
        env:
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND textPayload:"run_daily_learning"' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 2000 \
            --format 'value(timestamp,textPayload)' > logs.txt 2> err.txt \
            || { grep -oE "PERMISSION_DENIED|permission[^.]*" err.txt | head -2; exit 1; }
          grep -oE "^[0-9T:-]{16}|[0-9]+ predicciones basket h2h sin resultado|basket extra-resolution — [0-9]+/[0-9]+ resueltos|basket totales/hándicap — [0-9]+/[0-9]+ con marcador|check_result paralelo completado — [0-9]+/[0-9]+ con resultado" logs.txt \
            | awk '/^[0-9]{4}-/ {ts=$0; next} {print ts " " $0}' | sort | tail -40
          [ -s logs.txt ] || echo "sin líneas"
          rm -f logs.txt err.txt

      - name: Coste — tiempo de instancia facturable por servicio y prueba de lectura de facturación
        env:
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          # Cloud Monitoring (solo lectura): run.googleapis.com/container/billable_instance_time,
          # suma por servicio y día. Solo nombres de servicio y segundos.
          TOKEN=$(gcloud auth print-access-token)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          curl -sS -G "https://monitoring.googleapis.com/v3/projects/prediction-intelligence/timeSeries" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode 'filter=metric.type="run.googleapis.com/container/billable_instance_time"' \
            --data-urlencode "interval.startTime=$START" --data-urlencode "interval.endTime=$END" \
            --data-urlencode "aggregation.alignmentPeriod=86400s" \
            --data-urlencode "aggregation.perSeriesAligner=ALIGN_SUM" \
            --data-urlencode "aggregation.crossSeriesReducer=REDUCE_SUM" \
            --data-urlencode "aggregation.groupByFields=resource.labels.service_name" > ts.json
          python3 - <<'PY'
          import json
          d = json.load(open("ts.json"))
          if "error" in d:
              print("Monitoring: sin acceso —", d["error"].get("status"), d["error"].get("code"))
              raise SystemExit(0)
          print("== tiempo de instancia facturable (segundos de instancia; × vCPU y × GiB del servicio)")
          rows = []
          for s in d.get("timeSeries", []):
              name = s["resource"]["labels"].get("service_name", "?")
              pts = s.get("points", [])
              tot = sum(float(p["value"].get("doubleValue", p["value"].get("int64Value", 0))) for p in pts)
              rows.append((tot, name, len(pts)))
          for tot, name, n in sorted(rows, reverse=True):
              print(f"  {name}: {tot:,.0f} s en {n} días · media {tot / max(n, 1) / 60:,.0f} min/día")
          if not rows:
              print("  sin series")
          PY
          rm -f ts.json
          # Facturación: solo si la cuenta puede leerla (sin ids de cuenta en el log público).
          if out=$(gcloud billing projects describe prediction-intelligence --format='value(billingEnabled)' 2>&1); then
            echo "Facturación del proyecto legible: billingEnabled=$out"
          else
            echo "Facturación del proyecto: sin acceso ($(echo "$out" | grep -oE 'PERMISSION_DENIED|403|SERVICE_DISABLED|has not been used' | head -1))"
          fi
          n=$(gcloud billing accounts list --format='value(name)' 2>/dev/null | wc -l)
          echo "Cuentas de facturación visibles para la cuenta de servicio: $n"

      - name: sports-agent — tiempo facturable frente a peticiones (por día y por ruta)
        env:
          DAYS: ${{ inputs.days }}
          PYTHONIOENCODING: utf-8
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days inválido"; exit 1; }
          TOKEN=$(gcloud auth print-access-token)
          END=$(date -u +%Y-%m-%dT00:00:00Z)
          START=$(date -u -d "-${DAYS} days" +%Y-%m-%dT00:00:00Z)
          curl -sS -G "https://monitoring.googleapis.com/v3/projects/prediction-intelligence/timeSeries" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode 'filter=metric.type="run.googleapis.com/container/billable_instance_time" AND resource.labels.service_name="sports-agent"' \
            --data-urlencode "interval.startTime=$START" --data-urlencode "interval.endTime=$END" \
            --data-urlencode "aggregation.alignmentPeriod=86400s" \
            --data-urlencode "aggregation.perSeriesAligner=ALIGN_SUM" \
            --data-urlencode "aggregation.crossSeriesReducer=REDUCE_SUM" > bill.json
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="sports-agent" AND logName="projects/prediction-intelligence/logs/run.googleapis.com%2Frequests"' \
            --project prediction-intelligence --freshness "${DAYS}d" --limit 20000 --format json > req.json 2> err.txt \
            || { echo "peticiones: sin acceso ($(grep -oE 'PERMISSION_DENIED' err.txt | head -1))"; echo "[]" > req.json; }
          gcloud run services describe sports-agent --project prediction-intelligence --region europe-west1 \
            --format json > svc.json 2>/dev/null || echo "{}" > svc.json
          BILL_FILE=bill.json REQ_FILE=req.json SVC_FILE=svc.json python scripts/ops/billable_breakdown.py
          rm -f bill.json req.json svc.json err.txt

      - name: Semanal de «Señales de tendencia» — Ambos marcan, G5 y días sin ejecución (Firestore)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/trend_weekly_review.py
