# Backtest de Europa (Champions, Europa League, Conference League) con mp-e1
# (scripts/ops/uefa_backtest.py). SOLO LECTURA: lee hl_team_stats (grupo uefa) y hl_matches de
# Firestore + CSV públicos de football-data.co.uk. No pide nada a Highlightly y no escribe nada (no
# pasa CONFIRMAR). Log: solo agregados (recuentos, métricas por mercado y competición, factores por
# liga). Manual.
name: uefa-backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore httpx scipy numpy

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Backtest de Europa (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/uefa_backtest.py
