# Prueba SIN ESCRIBIR de las fichas de Europa (scripts/ops/uefa_preview_show.py): el backtest de mp-e1
# se calcula en memoria (no se guarda match_preview_metrics/mp-e1_backtest) y con él las fichas de la
# próxima jornada europea (partidos por jugar que ya están en hl_team_stats). Lee hl_team_stats,
# hl_matches y los CSV públicos de football-data.co.uk. 0 escrituras, 0 peticiones a Highlightly.
# Log: solo agregados y recuentos. Las fichas salen en un artefacto cifrado con la clave pública que se
# pasa (RSA OAEP + AES-256), retenido 1 día. Manual.
name: uefa-preview-show

on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: "Clave pública RSA (PEM en base64, una línea)"
        required: true
      desde:
        description: "Fecha AAAA-MM-DD desde la que buscar la jornada (vacío = hoy)"
        default: ""
      dias:
        description: "0 = la próxima jornada (3 días desde su primer partido); N = N días desde 'desde'"
        default: "0"

permissions:
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore httpx scipy numpy

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Fichas de Europa sin escribir
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
          OUT_FILE: ${{ runner.temp }}/fichas.txt
          DIAS: ${{ inputs.dias }}
          DESDE: ${{ inputs.desde }}
        run: |
          [[ "$DIAS" =~ ^[0-9]{1,2}$ ]] || { echo "dias inválido"; exit 1; }
          [[ -z "$DESDE" || "$DESDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "desde inválido"; exit 1; }
          python scripts/ops/uefa_preview_show.py

      - name: Cifrar
        if: ${{ always() }}
        env:
          PUBKEY_B64: ${{ inputs.pubkey_b64 }}
        run: |
          [ -f "$RUNNER_TEMP/fichas.txt" ] || { echo "sin fichero de fichas"; exit 0; }
          mkdir -p enc
          echo "$PUBKEY_B64" | base64 -d > "$RUNNER_TEMP/pub.pem"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/fichas.txt" \
            -out enc/fichas.txt.enc -pass file:"$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" -out enc/k.enc
          shred -u "$RUNNER_TEMP/fichas.txt" "$RUNNER_TEMP/k"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: uefa-fichas-enc
          path: enc/
          retention-days: 1
          if-no-files-found: ignore
