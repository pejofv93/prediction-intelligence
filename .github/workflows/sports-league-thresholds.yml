# ¿Qué mínimo de EV por liga aplica el generador de fútbol? (scripts/ops/league_thresholds.py)
# SOLO LECTURA: model_weights/backtest_thresholds, backtest_results, filter_blocks y alerts_sent.
# No escribe nada. Solo umbrales por liga y agregados (liga, EV, umbral). Manual, sin cron.
name: sports-league-thresholds

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Desde (AAAA-MM-DD)'
        required: false
        default: '2026-11-14'

permissions:
  contents: read

jobs:
  umbrales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Umbrales por liga (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
          SINCE: ${{ inputs.since }}
        run: python scripts/ops/league_thresholds.py
