# Fútbol femenino mp-w1 — SOLO LECTURA: recuento, dispersión y líneas (2023/24 + 2024/25) y
# backtest walk-forward (2025/26 + 2026/27) frente a la media de la liga, por mercado y liga.
# Lee hl_team_stats (grupo women). No escribe nada. El log solo lleva agregados (nada de equipos
# ni partidos: datos de Highlightly). Manual, sin cron.
name: sports-women-backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-cloud-firestore scipy httpx

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Recuento, dispersión, líneas y backtest (solo lectura)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIRESTORE_COLLECTION_PREFIX: ${{ secrets.FIRESTORE_COLLECTION_PREFIX }}
          PYTHONIOENCODING: utf-8
        run: python scripts/ops/women_backtest.py
